<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>컷시트</title>
<meta name="description" content="컷별 스토리보드와 러닝타임으로 영상 편집을 기획하는 오프라인 앱">
<meta name="theme-color" content="#F9FAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191C23" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="컷시트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: production sheet — sticky header; phone: one column; tablet landscape: slate + V1 track on the left, cut list on the right */
:root{
  --bg:#ECEEF2; --surface:#F9FAFC; --surface-2:#E2E5EC; --fg:#161922; --muted:#5A6172; --line:#CDD2DC;
  --accent:#2B55E0; --accent-ink:#FFFFFF; --accent-soft:#DCE4FC;
  --ok:#1E8752; --warn:#B36600; --bad:#C23838; --on-bad:#FFFFFF;
  --sec-open:#E39A2E; --sec-main:#22A493; --sec-high:#DA5A91; --sec-ppl:#8C7DDA; --sec-out:#4C86D1;
  --st-idea:#7A8191; --st-shot:#3A72D6; --st-edit:#C77F12; --st-done:#1E8752;
  --clip-ink:#11131A; --scrim:rgba(14,17,26,.42); --shadow:0 18px 48px -18px rgba(14,17,26,.35);
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111318; --surface:#191C23; --surface-2:#252935; --fg:#E6E8EE; --muted:#9AA1B2; --line:#2E3340;
    --accent:#7D9BFF; --accent-ink:#0D1220; --accent-soft:#222B48;
    --ok:#4CC387; --warn:#E3A33F; --bad:#EF6B6B; --on-bad:#1A0C0C;
    --sec-open:#F0AA45; --sec-main:#36BCA9; --sec-high:#E873A5; --sec-ppl:#A698EE; --sec-out:#6CA1E8;
    --st-idea:#8C93A4; --st-shot:#6E9EF2; --st-edit:#E3A33F; --st-done:#4CC387;
    --scrim:rgba(0,0,0,.6); --shadow:0 18px 48px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
.side,.content{display:contents}
.actions{order:10}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:9px;min-height:56px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1;letter-spacing:.02em;flex:none}
.brand svg{color:var(--accent);flex:none}
.switcher{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-weight:500;font-size:14px;text-align:left}
.switcher:hover{border-color:var(--muted)}
.sw-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.switcher svg{flex:none;color:var(--muted)}
.spacer{flex:1}
.sync{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;border:0;background:transparent;padding:6px 4px;border-radius:6px}
.sync:hover{background:var(--surface-2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.sync.busy i{background:var(--warn)}
.sync.off i{background:var(--muted)}
.sync.err{color:var(--bad)}
.sync.err i{background:var(--bad)}
@media (max-width:420px){.sync span{display:none}}

/* slate */
.slate{display:flex;flex-direction:column;gap:8px}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.badge{font-style:normal;font-size:11px;letter-spacing:.02em;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.dd{font-family:var(--f-mono);font-weight:500;letter-spacing:0;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--fg)}
.dd.soon{border-color:var(--warn);color:var(--warn)}
.dd.late{border-color:var(--bad);color:var(--bad)}
.title-in{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6.4vw,36px);line-height:1.2;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:2px 0;width:100%;min-width:0}
.title-in:focus{outline:none;border-bottom-color:var(--accent)}
.title-in::placeholder,.concept::placeholder{color:var(--muted);opacity:.7}
.concept{border:0;background:transparent;resize:none;padding:0;color:var(--muted);font-size:15px;width:100%;line-height:1.6;overflow:hidden}
.concept:focus{outline:none;color:var(--fg)}
.meta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 10px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:500}
.ratio{display:inline-block;border:1.5px solid currentColor;border-radius:2px;flex:none}
.mi{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.mi select,.mi input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;color:var(--fg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mi input.tgt{width:76px}

/* track overview */
.track{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.track-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px}
.tc-cap{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.tc-big{font-family:var(--f-mono);font-size:clamp(26px,7.5vw,32px);font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.rt-sub{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.rt-sub .num{font-family:var(--f-mono);color:var(--fg)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.stats{display:flex;gap:20px;margin:0}
.stats div{display:flex;flex-direction:column;gap:1px}
.stats dt{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stats dd{margin:0;font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.lane{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:8px;row-gap:5px;align-items:center;margin-top:18px}
.lane-label{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;text-align:center;padding:3px 0;background:var(--bg);align-self:stretch;display:grid;place-items:center}
.bar{position:relative;height:44px}
.bar-in{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:var(--bg)}
.clip{position:absolute;top:0;bottom:0;border:0;padding:0;margin:0;background:var(--c);color:var(--clip-ink);box-shadow:inset -1px 0 0 var(--surface);overflow:hidden;font-family:var(--f-mono);font-size:11px;font-weight:500;display:flex;align-items:flex-start;justify-content:flex-start}
.clip span{padding:4px 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.clip:hover{filter:brightness(1.08) saturate(1.05)}
.clip:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.rest{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--line) 0 1px,transparent 1px 7px)}
.over{position:absolute;top:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 60%,transparent) 0 3px,transparent 3px 7px)}
.tmark{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--fg);margin-left:-1px;pointer-events:none}
.tmark span{position:absolute;bottom:100%;left:0;transform:translateX(-50%);font-size:11px;font-weight:500;white-space:nowrap;padding-bottom:1px;color:var(--fg)}
.tmark.end span{transform:translateX(-100%)}
.ruler{grid-column:2;position:relative;height:18px}
.tick{position:absolute;top:0;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);transform:translateX(-50%);padding-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick::before{content:"";position:absolute;top:0;left:50%;height:4px;border-left:1px solid var(--muted)}
.tick.start{transform:none}
.tick.start::before{left:0}
.tick.end{transform:translateX(-100%)}
.tick.end::before{left:auto;right:0}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.legend b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.legend span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* cuts */
.cuts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cut{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px);transition:box-shadow .35s}
.cut.flash{box-shadow:0 0 0 2px var(--c)}
.cut-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.cut-no{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.cut-no i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.cut-tc{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cut-meta{display:flex;align-items:center;gap:8px;margin-left:auto}
.sec-pick,.st{position:relative;display:inline-flex;align-items:center}
.sec-pick select,.st select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:999px;font-weight:500;line-height:1.3}
.sec-pick select{background:color-mix(in srgb,var(--c) 15%,var(--surface));padding:5px 26px 5px 24px;font-size:13px}
.sec-pick::before{content:"";position:absolute;left:10px;width:8px;height:8px;border-radius:50%;background:var(--c);pointer-events:none}
.sec-pick::after,.st::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.dur{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 9px 0 2px}
.dur input{width:58px;border:0;background:transparent;padding:5px 4px;font-family:var(--f-mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.dur input::-webkit-inner-spin-button,.dur input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.dur input:focus,.dur input:focus-visible{outline:none}
.dur:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.dur span{font-size:12px;color:var(--muted)}
.cut-body{display:flex;flex-direction:column;gap:8px}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl>span{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.fl textarea,.fl input{width:100%;border:1px solid transparent;background:var(--bg);border-radius:6px;padding:8px 10px;resize:none;line-height:1.5;font-size:14.5px}
.fl textarea{overflow:hidden;min-height:38px;display:block}
.fl textarea:focus,.fl input:focus,.fl textarea:focus-visible,.fl input:focus-visible{outline:none;border-color:var(--accent);background:var(--surface)}
.fl textarea::placeholder,.fl input::placeholder,.chk-add input::placeholder{color:var(--muted);opacity:.75}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:560px){.row2{grid-template-columns:minmax(0,1fr)}}
.cut-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.st select{background:color-mix(in srgb,var(--sc) 13%,var(--surface));padding:4px 26px 4px 22px;font-size:12.5px}
.st i{position:absolute;left:9px;width:7px;height:7px;border-radius:50%;background:var(--sc);pointer-events:none}
.st-idea{--sc:var(--st-idea)} .st-shot{--sc:var(--st-shot)} .st-edit{--sc:var(--st-edit)} .st-done{--sc:var(--st-done)}
.tools{display:flex;gap:2px;margin-left:auto}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:8px;color:var(--muted);padding:0;flex:none}
.icon-btn:hover:not(:disabled){background:var(--surface-2);color:var(--fg)}
.icon-btn:disabled{opacity:.3}
.icon-btn.del:hover:not(:disabled){color:var(--bad)}
.add-cut{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font-weight:500}
.add-cut:hover{border-color:var(--accent);color:var(--accent)}
.none{color:var(--muted);font-size:14px;padding:12px 2px;margin:0}

/* checklist */
.chk-head{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.meter{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.chk{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.chk li{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px}
.chk li+li{border-top:1px solid var(--line)}
.cb{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;flex:none;cursor:pointer}
.cb input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.cb .box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;color:transparent}
.cb input:checked+.box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.cb input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.chk-text{flex:1;min-width:0;border:0;background:transparent;padding:6px 6px;font-size:14.5px;border-radius:5px}
.chk-text:focus,.chk-text:focus-visible{outline:none;background:var(--bg)}
.chk li.done .chk-text{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.chk-add{display:flex;gap:8px;margin-top:10px}
.chk-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}

/* plan */
.plan{display:flex;flex-direction:column;gap:18px}
.plan-intro{margin:0;font-size:13.5px;color:var(--muted);max-width:62ch}
.plan .fl{gap:3px}
.pf-head{display:flex;align-items:center;gap:8px;min-height:30px}
.pf-label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--fg);min-width:0}
.pf-label i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.pf.filled .pf-label i{background:var(--ok);border-color:var(--ok)}
.plan .fl>span.pf-hint{font-size:12.5px;font-weight:400;letter-spacing:0;margin-bottom:5px;padding-left:16px}
.zoom-btn{margin-left:auto;padding:4px 10px;font-size:12.5px;gap:5px;color:var(--muted);flex:none}
.zoom-btn:hover{color:var(--fg)}
.pf.zoomed{position:fixed;inset:0;z-index:55;background:var(--surface);gap:6px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px),calc(50vw - 380px));padding-right:max(16px,env(safe-area-inset-right,0px),calc(50vw - 380px))}
.pf.zoomed .pf-label{font-size:18px}
.pf.zoomed .zoom-btn{color:var(--fg);border-color:var(--muted)}
.plan .pf.zoomed textarea{flex:1;height:auto!important;min-height:0;overflow:auto;font-size:17px;line-height:1.8;padding:14px 16px;background:var(--bg)}

/* notes */
.notes{display:flex;flex-direction:column;gap:14px}
.notes .fl textarea,.plan .fl textarea{background:var(--surface);border-color:var(--line);min-height:76px}
.refs{list-style:none;margin:-6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.refs a{color:var(--accent);text-decoration:none;word-break:break-all}
.refs a:hover{text-decoration:underline}
.refs:empty{display:none}

/* buttons + actions */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.ghost.danger-text{color:var(--bad)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.linkish{border:0;background:transparent;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.act-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.warn-text{font-size:13px;color:var(--bad)}
.hint{flex-basis:100%;margin:0;font-size:12.5px;color:var(--muted)}
.notice{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-radius:8px;padding:10px 12px;font-size:13.5px}

/* empty + loading */
.empty{display:flex;flex-direction:column;gap:12px;padding-block:20px 8px}
.empty h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,40px);margin:0;line-height:1.2;text-wrap:balance}
.empty p{margin:0 0 6px;color:var(--muted);max-width:58ch}
.loading{padding-block:36px;display:flex;flex-direction:column;gap:14px;color:var(--muted)}
.sk{height:44px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.4s linear infinite}
.sk.short{height:18px;width:55%}
@keyframes sk{to{background-position:-200% 0}}

/* templates */
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.tpls{grid-template-columns:minmax(0,1fr)}}
.tpl{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px}
.tpl:hover{border-color:var(--accent)}
.tpl b{font-weight:700;font-size:15px}
.tpl>span{font-size:12.5px;color:var(--muted)}
.mini{display:flex;height:8px;border-radius:2px;overflow:hidden;gap:1px;background:var(--bg)}
.mini i{background:var(--c);min-width:2px}

/* sheets, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;z-index:51;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 20px);width:min(560px,calc(100% - 24px));max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 40px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 18px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0;font-weight:400}
.sheet-sub{font-size:12px;color:var(--muted);font-weight:500;margin:18px 0 8px;letter-spacing:.06em}
.sheet-p{margin:14px 0;font-size:14px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pitem{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pitem:hover{background:var(--bg)}
.pitem.on{background:var(--accent-soft)}
.pt{font-weight:500;display:flex;gap:8px;align-items:center;min-width:0}
.pt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{margin:4px 0 0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 12px;font-size:14px}
.kv div+div{border-top:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv dd small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.acct{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:4px;background:var(--bg)}
.acct-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.acct-who{display:flex;flex-direction:column;min-width:0}
.acct-who b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-who span{font-size:12.5px;color:var(--muted)}
.acct p{margin:0;font-size:13.5px;color:var(--muted)}
.g-btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14.5px}
.g-btn:hover{border-color:var(--muted)}
.g-btn svg{flex:none}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;padding:2px 4px}
.copybox textarea{width:100%;min-height:220px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;resize:vertical}
.copybox p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}

/* tablet landscape: two columns */
@media (min-width:1000px){
  .wrap{max-width:1240px}
  main.wrap.split{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);column-gap:28px;align-items:start}
  .split .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 92px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 92px);overflow:auto;padding-bottom:8px}
  .split .content{display:flex;flex-direction:column;gap:18px;min-width:0}
  .split .title-in{font-size:30px}
  .split .actions{border-top:0;padding-top:0;margin-top:0}
  .empty .tpls{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media (prefers-reduced-motion:reduce){.sk{animation:none}.cut{transition:none}}
</style>

      changed = applyRemote(ch.doc.id, ch.doc.data()) || changed;

    if (!snap.metadata.fromCache) {
      SYNC.lastSync = Date.now();
      if (!SYNC.initialDone) { SYNC.initialDone = true; uploadNewer(snap); }

async function initSync() {

  SYNC.enabled = true; updateSync();
  try {
    const FB = await loadFirebaseLib();
    SYNC.FB = FB;
    const app = FB.initializeApp(cfg);
    SYNC.auth = FB.getAuth(app);
    try { SYNC.fs = FB.initializeFirestore(app, { localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }) }); }
    catch (e) { SYNC.fs = FB.getFirestore(app); }

      renderSafe();

  } catch (e) {
    SYNC.state = 'error';
    SYNC.msg = '동기화 기능을 불러오지 못했어요. 인터넷에 연결된 상태에서 앱을 한 번 다시 열어 주세요.';

function signIn() {

  const provider = new SYNC.FB.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  SYNC.FB.signInWithPopup(SYNC.auth, provider).then(() => toast('로그인했어요. 이제 같은 계정의 기기끼리 자동으로 맞춰져요.')).catch(e => {
    const code = e && e.code;
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') {

function signInFailed(e) {

  if (code === 'auth/unauthorized-domain') toast(`Firebase 승인된 도메인에 ${location.hostname}을 추가해 주세요.`);
  else if (code === 'auth/operation-not-allowed') toast('Firebase에서 Google 로그인을 사용 설정해 주세요.');
  else if (code === 'auth/network-request-failed') toast('인터넷에 연결된 상태에서 다시 로그인해 주세요.');
  else toast('로그인하지 못했어요. (' + code + ')');
}

function autosize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

/* ---------- export / import ---------- */
function oneLine(s) { return s.replace(/\s*\n+\s*/g, ' / ').trim(); }
function exportText(p) {
  const { total, starts } = totals(p);
  const L = [];
  L.push(`[컷시트] ${p.title || '제목 없는 영상'}`);
  L.push(`${p.format} · ${p.fps}fps · 목표 ${mmss(p.target)} · 현재 ${mmss(total)} (${p.cuts.length}컷)`);
  if (p.due) L.push(`마감 ${p.due} (${dday(p.due).label})`);
  if (p.concept.trim()) L.push(`기획 의도: ${oneLine(p.concept)}`);
  const planLines = PLAN.filter(f => p.plan[f.id].trim()).map(f => `${f.label}: ${oneLine(p.plan[f.id])}`);
  if (planLines.length) L.push('', '[기획]', ...planLines);
  L.push('');
  p.cuts.forEach((c, i) => {
    L.push(`#${pad2(i + 1)}  ${tc(starts[c.id], p.fps)}  ${sec(c.section).label}  ${fmtDur(c.dur)}  [${stat(c.status).label}]`);
    if (c.visual.trim()) L.push(`  화면: ${oneLine(c.visual)}`);
    if (c.audio.trim()) L.push(`  자막·대사: ${oneLine(c.audio)}`);
    if (c.fx.trim()) L.push(`  효과·전환: ${c.fx.trim()}`);
    if (c.source.trim()) L.push(`  소스: ${c.source.trim()}`);
  });
  if (p.checklist.length) {
    L.push('', `체크리스트 ${p.checklist.filter(k => k.done).length}/${p.checklist.length}`);
    p.checklist.forEach(k => L.push(`${k.done ? '[x]' : '[ ]'} ${k.text}`));
  }
  if (p.notes.bgm.trim()) L.push('', 'BGM·효과음', p.notes.bgm.trim());
  if (p.notes.refs.trim()) L.push('', '레퍼런스', p.notes.refs.trim());
  if (p.notes.memo.trim()) L.push('', '메모', p.notes.memo.trim());
  return L.join('\n');
}
function exportCSV(p) {
  const { starts } = totals(p);
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['번호', '시작 타임코드', '길이(초)', '섹션', '화면', '자막·대사', '효과·전환', '소스', '상태']];
  p.cuts.forEach((c, i) => rows.push([i + 1, tc(starts[c.id], p.fps), c.dur, sec(c.section).label, c.visual, c.audio, c.fx, c.source, stat(c.status).label]));
  return '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
}
// Must be called straight from a tap: the share sheet needs the tap's user activation.
async function shareOrDownload(filename, text, mime) {
  let file = null;
  try { file = new File([text], filename, { type: mime }); } catch (e) { /* old browser */ }
  if (file && navigator.canShare && navigator.share) {
    let ok = false;
    try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
    if (ok) {
      try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
      catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
    }
  }
  const blob = file || new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return 'downloaded';
}
function safeName(t) { return (t || '제목 없는 영상').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 60) || '컷시트'; }
function exportAll() {
  const payload = { app: 'cutsheet', version: 1, exportedAt: new Date().toISOString(), projects: [...S.projects.values()] };
  shareOrDownload(`컷시트-백업-${ymd()}.json`, JSON.stringify(payload, null, 1), 'application/json').then(r => {
    if (r === 'cancel') return;
    S.lastBackup = Date.now();
    store.setMeta('lastBackup', S.lastBackup).catch(() => {});
    toast(r === 'shared' ? '백업 파일을 보냈어요. 파일 앱이나 드라이브에 저장해 두세요.' : '백업 파일을 저장했어요.');
    render();
  });
}
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { toast('파일을 읽지 못했어요. 컷시트에서 만든 .json 백업 파일인지 확인해 주세요.'); return; }
  const arr = Array.isArray(data) ? data : data && Array.isArray(data.projects) ? data.projects : data && Array.isArray(data.cuts) ? [data] : null;
  if (!arr) { toast('컷시트 백업 파일이 아니에요.'); return; }
  let added = 0, updated = 0, kept = 0, failed = 0;
  for (const d of arr) {
    if (!d || typeof d !== 'object') continue;
    const id = typeof d.id === 'string' && d.id.length > 0 && d.id.length <= 100 ? d.id : uid();
    const p = normalize(d, id);
    const ex = S.projects.get(id);
    if (ex && ex.updatedAt >= p.updatedAt) { kept++; continue; }
    S.projects.set(id, p);
    try { await store.put(JSON.parse(JSON.stringify(p))); ex ? updated++ : added++; scheduleRemote(id); }
    catch (e) { failed++; }
  }
  pickCurrent(); S.sheet = null; render();
  const parts = [];
  if (added) parts.push(`${added}개 추가`);
  if (updated) parts.push(`${updated}개 업데이트`);
  if (kept) parts.push(`${kept}개는 이 기기 쪽이 최신이라 그대로`);
  toast(failed ? `${failed}개는 저장하지 못했어요. 기기 저장 공간을 확인해 주세요.` : parts.length ? '불러왔어요: ' + parts.join(', ') : '불러올 프로젝트가 없었어요.');
}

function moveCut(p, cid, dir) {

  [p.cuts[i], p.cuts[j]] = [p.cuts[j], p.cuts[i]];

function addCutAfter(p, index, base) {

  const c = base ? { ...base, id: uid() } : newCut({ section: prev ? prev.section : 'main', dur: 5 });
  p.cuts.splice(index + 1, 0, c);
  touch(p); render();
  const ta = $app.querySelector(`[data-k="cut:${c.id}:visual"]`);
  if (ta) {
    document.getElementById('cut-' + c.id).scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });

function addChecklist(p) {

async function copyText(p) {

/* ---------- events ---------- */
$app.addEventListener('input', e => {
  const el = e.target, key = el.dataset && el.dataset.k;
  if (!key) return;
  const p = cur(); if (!p) return;
  if (el.tagName === 'TEXTAREA') autosize(el);
  const [kind, id, field] = key.split(':');
  if (kind === 'title') {
    p.title = el.value.slice(0, 120);
    const sw = document.getElementById('swLabel'); if (sw) sw.textContent = p.title || '제목 없는 영상';
  } else if (kind === 'concept') {
    p.concept = el.value;
  } else if (kind === 'cut') {
    const c = p.cuts.find(x => x.id === id); if (!c) return;
    if (field === 'dur') {
      const v = parseFloat(el.value);
      if (!(v > 0)) return;
      c.dur = Math.min(36000, Math.round(v * 100) / 100);
      touch(p); refreshDerived(p); return;
    }
    if (!['visual', 'audio', 'fx', 'source'].includes(field)) return;
    c[field] = el.value;
  } else if (kind === 'chk' && field === 'text') {
    const item = p.checklist.find(x => x.id === id); if (!item) return;
    item.text = el.value;
  } else if (kind === 'plan' && PLAN.some(f => f.id === id)) {
    p.plan[id] = el.value;
    const box = el.closest('.pf'); if (box) box.classList.toggle('filled', !!el.value.trim());
    const pc = document.getElementById('planCount'); if (pc) pc.textContent = planFilled(p) + '/' + PLAN.length;
  } else if (kind === 'notes' && ['bgm', 'refs', 'memo'].includes(id)) {
    p.notes[id] = el.value;
    if (id === 'refs') { const r = document.getElementById('refs'); if (r) r.innerHTML = refsHTML(p); }
  } else return;
  touch(p);
});
$app.addEventListener('change', e => {
  const el = e.target, key = el.dataset && el.dataset.k;
  if (!key) return;
  const p = cur(); if (!p) return;
  const [kind, id, field] = key.split(':');
  if (kind === 'fps') { p.fps = FPS.includes(+el.value) ? +el.value : 30; }
  else if (kind === 'target') {
    const v = parseTime(el.value);
    if (v > 0) p.target = Math.min(36000, v);
    else { el.value = mmss(p.target); return; }
  }
  else if (kind === 'due') { p.due = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : ''; }
  else if (kind === 'cut') {
    const c = p.cuts.find(x => x.id === id); if (!c) return;
    if (field === 'section' && SECTIONS.some(s => s.id === el.value)) c.section = el.value;
    else if (field === 'status' && STATUSES.some(s => s.id === el.value)) c.status = el.value;
    else if (field === 'dur') { if (!(parseFloat(el.value) > 0)) el.value = +c.dur.toFixed(2); return; }
    else return;
  }
  else if (kind === 'chk' && field === 'done') {
    const item = p.checklist.find(x => x.id === id); if (!item) return;
    item.done = el.checked;
  }
  else return;
  touch(p); render();
});
$app.addEventListener('compositionstart', () => { composing = true; });
$app.addEventListener('compositionend', () => { composing = false; if (pendingRender) { pendingRender = false; setTimeout(render, 0); } });
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  if (e.target.id === 'chkNew') { e.preventDefault(); const p = cur(); if (p) addChecklist(p); }
  else if (e.target.classList && e.target.classList.contains('title-in')) { e.preventDefault(); e.target.blur(); }
});
function setZoom(id) {
  const prev = S.zoom;
  S.zoom = id;
  render();
  if (id) {
    const ta = document.getElementById('plan-' + id);
    if (ta) { ta.focus({ preventScroll: true }); const n = ta.value.length; try { ta.setSelectionRange(n, n); } catch (e) { /* ignore */ } }
  } else if (prev) {
    const btn = $app.querySelector(`[data-k="b:zoom:${prev}"]`);
    if (btn) { btn.closest('.pf').scrollIntoView({ block: 'center' }); btn.focus({ preventScroll: true }); }
  }
}
function onClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const p = cur();
  switch (act) {
    case 'projects': openSheet('projects'); return;
    case 'backup': openSheet('backup'); return;
    case 'close-sheet': S.sheet = null; render(); return;
    case 'close-layer': closeLayer(); return;
    case 'open': openProject(b.dataset.id); return;
    case 'new': S.sheet = null; createFrom(b.dataset.v); return;
    case 'tab': S.tab = b.dataset.v; S.zoom = null; saveUI(); render(); return;
    case 'zoom': setZoom(S.zoom === b.dataset.v ? null : b.dataset.v); return;
    case 'jump': jumpTo(b.dataset.cid); return;
    case 'export-all': exportAll(); return;
    case 'reload': flushAll(); $toast.hidden = true; setTimeout(() => location.reload(), 350); return;
    case 'signin': signIn(); return;
    case 'signout': signOutSync(); return;
    case 'import': $file.value = ''; $file.click(); return;
    case 'undo': {
      const u = S.undo; S.undo = null; $toast.hidden = true;
      const tp = u && S.projects.get(u.pid);
      if (!tp) return;
      if (u.type === 'cut') tp.cuts.splice(Math.min(u.index, tp.cuts.length), 0, u.item);
      else if (u.type === 'chk') tp.checklist.splice(Math.min(u.index, tp.checklist.length), 0, u.item);
      touch(tp); S.currentId = tp.id; render(); return;
    }
  }
  if (!p) return;
  switch (act) {
    case 'copy-text': copyText(p); return;
    case 'csv': shareOrDownload(safeName(p.title) + '_컷시트.csv', exportCSV(p), 'text/csv').then(r => { if (r === 'downloaded') toast('CSV 파일을 저장했어요'); }); return;
    case 'format': p.format = b.dataset.v; touch(p); render(); return;
    case 'add-cut': addCutAfter(p, p.cuts.length - 1); return;
    case 'cut-up': moveCut(p, b.dataset.cid, -1); return;
    case 'cut-down': moveCut(p, b.dataset.cid, 1); return;
    case 'cut-ins': addCutAfter(p, p.cuts.findIndex(c => c.id === b.dataset.cid)); return;
    case 'cut-dup': {
      const i = p.cuts.findIndex(c => c.id === b.dataset.cid);
      if (i >= 0) addCutAfter(p, i, { ...p.cuts[i], status: 'idea' });
      return;
    }
    case 'cut-del': {
      const i = p.cuts.findIndex(c => c.id === b.dataset.cid); if (i < 0) return;
      const [item] = p.cuts.splice(i, 1);
      S.undo = { type: 'cut', pid: p.id, index: i, item };
      touch(p); render(); toast(`컷 ${pad2(i + 1)}을 삭제했어요`, true); return;
    }
    case 'chk-add': addChecklist(p); return;
    case 'chk-del': {
      const i = p.checklist.findIndex(k => k.id === b.dataset.id); if (i < 0) return;
      const [item] = p.checklist.splice(i, 1);
      S.undo = { type: 'chk', pid: p.id, index: i, item };
      touch(p); render(); toast('할 일을 삭제했어요', true); return;
    }
    case 'dup-project': {
      const copy = normalize(JSON.parse(JSON.stringify(p)), uid());
      copy.title = ((p.title || '제목 없는 영상') + ' 사본').slice(0, 120); copy.example = false;
      copy.createdAt = copy.updatedAt = Date.now();
      S.projects.set(copy.id, copy); openProject(copy.id); touch(copy); toast('프로젝트를 복제했어요'); return;
    }
    case 'del-project': S.confirmDelete = true; render(); return;
    case 'del-cancel': S.confirmDelete = false; render(); return;
    case 'del-confirm': {
      const title = p.title || '제목 없는 영상';
      removeProject(p.id); S.currentId = null; S.confirmDelete = false; pickCurrent(); saveUI(); render(); window.scrollTo(0, 0);
      toast(`'${title}'을 삭제했어요`); return;
    }
  }
}
$app.addEventListener('click', onClick);
$toast.addEventListener('click', onClick);
$layer.addEventListener('click', onClick);
$file.addEventListener('change', () => { const f = $file.files && $file.files[0]; if (f) importFile(f); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$layer.hidden) { closeLayer(); return; }
  if (S.zoom) { setZoom(null); return; }
  if (S.sheet) { S.sheet = null; render(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
window.addEventListener('pagehide', flushAll);
window.addEventListener('online', () => { S.online = true; updateSync(); });
window.addEventListener('offline', () => { S.online = false; updateSync(); });

/* ---------- boot ---------- */
(async () => {
  loadUI();
  render();
  await store.open();
  let list = [];
  try { list = await store.loadAll(); } catch (e) { list = []; }
  (list || []).forEach(d => { if (d && typeof d.id === 'string') S.projects.set(d.id, normalize(d, d.id)); });
  try { S.lastBackup = await store.getMeta('lastBackup'); } catch (e) { S.lastBackup = null; }
  try { const t = await store.getMeta('tombs'); if (t && typeof t === 'object') tombs = t; } catch (e) { tombs = {}; }
  if (store.kind === 'memory') { S.sync = 'error'; S.syncMsg = '이 브라우저에서는 기기에 저장할 수 없어요. 사생활 보호 모드라면 일반 모드로 열어 주세요.'; }
  S.phase = 'ready';
  pickCurrent();
  render();
  if (S.projects.size) requestPersist();
  initSync();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    // A new version was installed: offer a reload instead of interrupting typing.
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true;
      clearTimeout(toastTimer);
      $toast.innerHTML = '<span>앱이 새 버전으로 업데이트됐어요</span><button type="button" data-act="reload">새로고침</button>';
      $toast.hidden = false;
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
</body>
